; RTX Video HDR - output quality settings
; Updated automatically when GUI settings change.
[interface]
; en / ko. Leave blank to use Korean on Korean Windows, English otherwise.
language=

[output]
mode=cq
cq=18
bitrate_mbps=40
container=mkv
gpu_index=0
gpu_name=

; Enable saved segments for manual resume (false: speed priority, cannot resume).
checkpoint=true
